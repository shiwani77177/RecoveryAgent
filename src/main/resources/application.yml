spring:
  application:
    name: recovery-agent

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:recovery}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

razorpay:
  key:
    id: ${RAZORPAY_KEY_ID:rzp_test_xxxxx}
    secret: ${RAZORPAY_KEY_SECRET:xxxxx}

jwt:
  secret: ${JWT_SECRET:recovery-agent-super-secret-key-hackathon-2026}

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    org.hibernate.SQL: info
    com.example.recovery_agent.webhook: debug

gemini:
  api:
    key: ${GEMINI_API_KEY:}
